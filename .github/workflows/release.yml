name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run vet and unit tests
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Build release binaries for Linux and Windows
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          rm -rf dist
          mkdir -p dist
          LDFLAGS="-s -w -X main.version=${VERSION}"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/multi-anti-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/multi-anti-linux-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o dist/multi-anti-windows-amd64.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o dist/multi-anti-windows-arm64.exe .

          got_version="$(./dist/multi-anti-linux-amd64 version)"
          if [[ "$got_version" != "multi-anti ${VERSION}" ]]; then
            echo "unexpected version output: ${got_version} (expected multi-anti ${VERSION})" >&2
            exit 1
          fi

          (cd dist && sha256sum multi-anti-* > SHA256SUMS.txt)
          ls -lh dist

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber dist/*
          else
            PRERELEASE_FLAG=""
            if [[ "$TAG" == *-* ]]; then
              PRERELEASE_FLAG="--prerelease"
            fi
            gh release create "$TAG" --title "$TAG" --generate-notes $PRERELEASE_FLAG dist/*
          fi
